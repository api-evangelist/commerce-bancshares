  type: Documentation
  note: Modern Treasury partner-gated integration layer over Commerce Bank accounts.
actions:
  openapiHarvested: false
  reason: >-
    No publicly downloadable OpenAPI/Swagger exists; the developer portal is
    registration- and WAF-gated, so nothing could be harvested verbatim without
    fabrication. Identity + honest posture recorded only.
