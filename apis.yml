name: Commerce Bank
kind: company
description: >-
  Commerce Bank is the principal banking subsidiary of Commerce Bancshares,
  Inc. (NASDAQ CBSH), a Missouri-based regional bank holding company with roughly
  $32 billion in assets and dual headquarters in Kansas City and St. Louis. Commerce
  Bank is a Missouri state-chartered bank and Federal Reserve member, founded in 1865,
  offering personal, business, commercial, and wealth-management services across the
  U.S. Midwest. Its API posture is corporate/embedded-banking oriented rather than a
  fully open public program: it runs a registration-gated external developer portal
  (developers.commercebank.com) and a CommercePayments developer platform, and delivers
  ERP-embedded banking via Commerce Connections Direct. Consumer-permissioned data
  sharing is largely intermediated through aggregators such as Plaid and platforms
  like Modern Treasury rather than a documented first-party, self-serve open-banking
  API. No public FDX or CFPB Section 1033 data-access posture is documented, and no
  downloadable OpenAPI/Swagger is publicly available.
